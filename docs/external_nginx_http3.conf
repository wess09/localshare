# 外部 Nginx HTTP/3 配置示例
# 用于在 localshare 容器外部配置 HTTP/3 支持

server {
    listen 80;
    listen [::]:80;
    server_name app.pywebio.online;  # 替换为你的域名
    
    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;  # HTTP/3 QUIC 支持
    listen [::]:443 quic;
    
    http2 on;  # 启用 HTTP/2
    http3 on;  # 启用 HTTP/3
    
    server_name app.pywebio.online;  # 替换为你的域名
    
    # SSL 证书配置
    ssl_certificate /path/to/your/cert.pem;
    ssl_certificate_key /path/to/your/cert.key;
    
    # HTTP/3 相关配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data on;  # 启用 0-RTT
    
    # 告知客户端支持 HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header QUIC-Status $quic;  # 调试用
    
    # 反向代理到 localshare 容器
    location / {
        proxy_pass http://localhost:80;  # 或者容器的 IP:80
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# WebSocket 升级支持
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

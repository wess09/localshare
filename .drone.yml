kind: pipeline
type: exec
name: default

trigger:
  event:
    - push

steps:
  - name: build
    commands:
      - >
        docker build --pull --no-cache
        --build-arg VCS_REF="${DRONE_COMMIT_SHA:-unknown}"
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        --build-arg SOURCE_REPOSITORY="${DRONE_REPO_LINK:-https://github.com/wess09/localshare}"
        -t localshare:latest
        -t localshare:"${DRONE_COMMIT_SHA:-manual}"
        .
      - docker image inspect localshare:latest --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
  - name: deploy
    commands:
      - docker rm -f localshare || true
      - >
        docker run --restart=always --name localshare -d -p 1022:1022 -p 443:443
        -e APP_SERVER_NAME=app.pywebio.online
        -e DATABASE_URL="${DATABASE_URL}"
        -v /opt/localshare_config:/config
        --label="traefik.http.routers.localshare.rule=HostRegexp(\`{subdomain:[a-z0-9]+}.app.pywebio.online\`, \`app.pywebio.online\`)"
        --label="traefik.http.services.localshare.loadbalancer.server.port=80"
        localshare
